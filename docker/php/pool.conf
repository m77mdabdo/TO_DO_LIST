[www]
listen = 9000

; FPM_MAX_CHILDREN caps the PHP processes (and so memory: roughly 30-60 MB each).
pm = dynamic
pm.max_children = ${FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
; Recycle workers now and then so a slow leak can't grow forever.
pm.max_requests = 500
request_terminate_timeout = 120s

; Keep the container's environment (APP_KEY, DB_*, MAIL_*): the app reads it with getenv().
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
; nginx already logs every request.
access.log = /dev/null

; For the container health check.
ping.path = /fpm-ping
ping.response = pong
