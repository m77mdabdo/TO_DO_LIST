; Production settings on top of php.ini-production.
expose_php = Off
memory_limit = 256M
max_execution_time = 60
; The app accepts attachments up to 10 MB.
upload_max_filesize = 12M
post_max_size = 14M

; Sessions live on the storage volume, so a restart or a new image doesn't sign everyone out.
session.save_path = /var/www/html/storage/sessions
session.use_strict_mode = 1
session.cookie_httponly = 1
session.gc_probability = 1
session.gc_divisor = 1000

; OPcache keeps compiled PHP in memory. The code never changes inside an image, so files
; aren't re-checked (set PHP_OPCACHE_VALIDATE_TIMESTAMPS=1 when editing live, as in development).
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = ${PHP_OPCACHE_VALIDATE_TIMESTAMPS}
opcache.revalidate_freq = 0
realpath_cache_size = 4096K
realpath_cache_ttl = 600
