name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, mbstring, fileinfo
          coverage: none
      - name: Lint
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: Tests
        run: php tests/run.php

  # The same suite on the databases XAMPP and most hosts use. Each test gets its own
  # throwaway database (tests/Support/TestDatabase.php), dropped when the run ends.
  tests-mysql:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - db: mariadb:10.11
            php: '8.1'
          - db: mysql:8.4
            php: '8.3'
    name: tests (${{ matrix.db }}, PHP ${{ matrix.php }})
    services:
      db:
        image: ${{ matrix.db }}
        env:
          MARIADB_ROOT_PASSWORD: root
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd "mariadb-admin ping -proot || mysqladmin ping -proot"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, pdo_sqlite, mbstring, fileinfo
          coverage: none
      - name: Tests
        env:
          TEST_DB: mysql
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_PORT: '3306'
          TEST_DB_USER: root
          TEST_DB_PASS: root
        run: php tests/run.php

  static-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, mbstring, fileinfo
          coverage: none
          tools: phpstan:1.12
      - name: PHPStan
        run: phpstan analyse --no-progress --memory-limit=512M
